name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # MILP with binary facility variables and continuous flows — HiGHS via the
      # highspy wheel handles it. No conda, no Ipopt. CBC is documented as a
      # fallback but not installed here.
      - name: Install package
        run: pip install -e ".[dev,solvers,viz]"

      - name: Lint with ruff
        run: ruff check src tests app data

      # The sample networks are small by design, so the whole suite stays fast
      # and every instance can be solved in CI.
      - name: Run tests
        run: pytest -v

      - name: Streamlit app syntax smoke test
        run: python -m py_compile app/streamlit_app.py
